name: Character data sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を禁止して、同じ main に対する push 競合を防止
concurrency:
  group: character-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch and normalize character data
        run: |
          python scripts/character_sync.py
          python scripts/character_skill_sync.py

      - name: Commit and safely push changed snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GuildBattle Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/character-sync-latest.json data/character-skill-sync-latest.json

          if git diff --cached --quiet; then
            echo "No character data changes."
            exit 0
          fi

          git commit -m "chore: sync character data"

          # main の最新状態を取得してから、今回のコミットを載せ直す。
          # これにより non-fast-forward による push 拒否を防止する。
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Character data sync pushed successfully."
              exit 0
            fi

            echo "Push was rejected because main moved. Retrying..."
            sleep 2
          done

          echo "Failed to push after 3 attempts."
          exit 1
