name: Character data sync
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch and normalize character data
        run: python scripts/character_sync.py
      - name: Commit changed snapshot
        run: |
          git config user.name "GuildBattle Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/character-sync-latest.json
          git diff --cached --quiet || git commit -m "chore: sync character data"
          git push
